site_name: template-repo
repo_url: https://github.com/klima-aero/template-repo

theme:
  name: material

nav:
  - Home: index.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_submodules: true
