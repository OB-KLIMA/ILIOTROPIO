name: Bug report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: dropdown
    id: component
    attributes:
      label: Where does this happen?
      options:
        - Application code
        - Tests
        - CI / tooling
        - Documentation
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: local dev / VM / prod, OS, Python version, commit SHA
